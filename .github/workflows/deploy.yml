name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Envoyer les fichiers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          tar -czf /tmp/app.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='.env' \
            index.js package.json package-lock.json deploy README.md
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" /tmp/app.tar.gz "$SSH_USER@$SSH_HOST:~/app.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/bot && tar -xzf ~/app.tar.gz -C ~/bot && rm -f ~/app.tar.gz"

      - name: Écrire le .env depuis les secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TOKEN: ${{ secrets.TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: |
          printf 'TOKEN=%s\nCHANNEL_ID=%s\nGUILD_ID=%s\n' \
            "$TOKEN" "$CHANNEL_ID" "$GUILD_ID" \
          | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            'cat > ~/bot/.env && chmod 600 ~/bot/.env'

      - name: Installer / redémarrer le service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            'cd ~/bot && bash deploy/install.sh'

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
